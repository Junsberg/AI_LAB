  .aib .bias { margin: 0; white-space: nowrap; } .aih { color: var(--mute); font-size: 12.5px; } .aih b { color: var(--fg); }
  .aib h3 { margin-top: 10px; }

  .price.tu { animation: tu .7s ease-out; } .price.td { animation: td .7s ease-out; }
  @keyframes tu { from { color: var(--up); } to { color: var(--fg); } }
  @keyframes td { from { color: var(--down); } to { color: var(--fg); } }
  .live-ok .live { animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--up) 0%, transparent); } }

<script>
const D = /*__DATA__*/null;   // build snapshot: OKX / Coinbase CVD (hourly) and the offline fallback

/*PURE*/
const HOUR = 3600e3;
const TFS = { '15m': 15 * 60e3, '1h': HOUR, '4h': 4 * HOUR, '1d': 24 * HOUR };

/** EMA seeded with the SMA of the first n values; null until then (same as indicators.ema). */
function ema(values, n) {
  const out = new Array(values.length).fill(null);
  if (values.length < n) return out;
  let prev = 0;
  for (let i = 0; i < n; i++) prev += values[i];
  prev /= n; out[n - 1] = prev;
  const k = 2 / (n + 1);
  for (let i = n; i < values.length; i++) { prev = values[i] * k + prev * (1 - k); out[i] = prev; }
  return out;
}

/** Unfilled 3-candle fair value gaps (same rules as indicators.find_fvgs). Candle = [t, o, h, l, c, ...]. */
function findFvgs(c, tf, tfMs, nowMs, minGap = 0.0005) {
  const zones = [];
  for (let i = 2; i < c.length; i++) {
    if (c[i][0] + tfMs > nowMs) break;
    const a = c[i - 2], mid = c[i - 1], x = c[i];
    let kind, lo, hi;
    if (x[3] > a[2]) { kind = 'bull'; lo = a[2]; hi = x[3]; }
    else if (x[2] < a[3]) { kind = 'bear'; lo = x[2]; hi = a[3]; }
    else continue;
    if ((hi - lo) / x[4] < minGap) continue;
    let filled = false;
    for (let j = i + 1; j < c.length; j++) {
      const l = c[j];
      if (kind === 'bull') { if (l[3] <= lo) { filled = true; break; } hi = Math.min(hi, l[3]); }
      else { if (l[2] >= hi) { filled = true; break; } lo = Math.max(lo, l[2]); }
    }
    if (!filled) zones.push({ kind, tf, t: mid[0], lo, hi });
  }
  return zones;
}

/** The n zones closest to price, returned oldest first (same as indicators.nearest). */
function nearestZones(zones, price, n) {
  const dist = z => (z.lo <= price && price <= z.hi) ? 0 : Math.min(Math.abs(z.lo - price), Math.abs(z.hi - price));
  return zones.slice().sort((a, b) => dist(a) - dist(b)).slice(0, n).sort((a, b) => a.t - b.t);
}

/** Running sum; null until the first non-null delta. */
function cumSum(deltas) {
  let s = 0, started = false;
  return deltas.map(v => { if (v != null) { started = true; s += v; } return started ? s : null; });
}
/** Make a cumulative series start at 0 at index i0. */
function rebase(cum, i0) {
  const b = i0 > 0 && cum[i0 - 1] != null ? cum[i0 - 1] : 0;
  return cum.map(v => v == null ? null : v - b);
}
/** Values of a time-keyed Map at each candle open time (null where missing). */
function alignMap(map, times) { return times.map(t => map.has(t) ? map.get(t) : null); }
/** Merge rows into an existing candle array by open time (replace or append, keeps sorted). */
function mergeRows(old, rows) {
  const m = new Map(old.map(r => [r[0], r]));
  for (const r of rows) m.set(r[0], r);
  return [...m.values()].sort((a, b) => a[0] - b[0]);
}
/**
 * Sum hourly deltas ({hourOpenMs: delta}) into tfMs buckets. A bucket that is not fully covered is
 * dropped unless it holds the newest hour (the still-forming one).
 */
function aggregateHourly(hourMap, tfMs) {
  const per = tfMs / HOUR, sums = new Map(), cnt = new Map();
  let newest = -Infinity;
  for (const [t, v] of hourMap) {
    const b = Math.floor(t / tfMs) * tfMs;
    sums.set(b, (sums.get(b) || 0) + v); cnt.set(b, (cnt.get(b) || 0) + 1); newest = Math.max(newest, t);
  }
  const out = new Map();
  for (const [b, s] of sums) if (cnt.get(b) === per || b + tfMs > newest) out.set(b, s);
  return out;
}
/** Close of the last 1h candle in each tfMs bucket ({openMs: close}); incomplete past buckets are kept (close is the same). */
function aggregateCloses(closesByHour, tfMs) {
  const out = new Map(), last = new Map();
  for (const [t, c] of [...closesByHour].sort((a, b) => a[0] - b[0])) {
    const b = Math.floor(t / tfMs) * tfMs;
    if (!last.has(b) || t >= last.get(b)) { last.set(b, t); out.set(b, c); }
  }
  return out;
}
/** (price/ref - 1) * 100 at each time where both exist. */
function premiumPct(priceMap, refByTime, times) {
  return times.map(t => (priceMap.has(t) && refByTime.get(t)) ? (priceMap.get(t) / refByTime.get(t) - 1) * 100 : null);
}
/*END PURE*/

const FONT = '-apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
const EMA_PERIODS = [20, 50, 100, 200];
const EMA_VARS = { 20: '--e20', 50: '--e50', 100: '--e100', 200: '--e200' };
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const pad2 = v => String(v).padStart(2, '0');
const coarse = matchMedia('(pointer: coarse)').matches;
const $ = id => document.getElementById(id);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function fmtT(ms, tf) {
  const d = new Date(ms + D.utc_offset * HOUR);

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
/** Kline rows -> [t, o, h, l, c, quoteVol, takerBuyQuote] */
const toK = rows => rows.map(r => [r[0], +r[1], +r[2], +r[3], +r[4], +r[7], +r[10]]);
const spotK = (tf, limit) => getJSON(`${BN}/api/v3/klines?symbol=BTCUSDT&interval=${tf}&limit=${limit}`).then(toK);
const futK = (tf, limit) => getJSON(`${FAPI}/fapi/v1/klines?symbol=BTCUSDT&interval=${tf}&limit=${limit}`).then(toK);
const oiHist = (tf, limit) => getJSON(`${FAPI}/futures/data/openInterestHist?symbol=BTCUSDT&period=${tf}&limit=${limit}`)
  .then(rows => rows.map(r => [+r.timestamp, +r.sumOpenInterestValue]));
/** Coinbase BTC-USD closes -> Map(openMs -> close). 4h is built from 1h (Coinbase has no 4h). */
async function cbCloses(tf, pages, recent = false) {
  const gran = { '15m': 900, '1h': 3600, '4h': 3600, '1d': 86400 }[tf];
  let end = Date.now(), map = new Map();
  if (recent) {   // just the newest few bars (used by the 20 s live refresh)
    const from = new Date(end - (tf === '4h' ? 6 : 4) * gran * 1000).toISOString();
    for (const r of await getJSON(`${CB}/products/BTC-USD/candles?granularity=${gran}&start=${from}&end=${new Date(end).toISOString()}`)) map.set(r[0] * 1000, +r[4]);
    return tf === '4h' ? aggregateCloses(map, TFS['4h']) : map;
  }
  for (let p = 0; p < pages; p++) {
    const start = end - 300 * gran * 1000;
    const q = p === 0 && pages === 1 ? '' : `&start=${new Date(start).toISOString()}&end=${new Date(end).toISOString()}`;
    const rows = await getJSON(`${CB}/products/BTC-USD/candles?granularity=${gran}${q}`);
    for (const r of rows) map.set(r[0] * 1000, +r[4]);
    end = start;
  }
  return tf === '4h' ? aggregateCloses(map, TFS['4h']) : map;
}

/** Hourly deltas from the build snapshot (it stores cumulative values aligned to D.candles). */
function buildDeltas(key) {
  const p = D.cvd.find(x => x.key === key);
  if (!p || !p.values) return null;
  const m = new Map(); let prev = 0;
  p.values.forEach((v, i) => { if (v != null) { m.set(D.candles[i][0], v - prev); prev = v; } });
  return m;
}
/** Per-candle raw series for every panel on the current timeframe. */
function buildPanelData(S) {
  const times = S.times, tfMs = TFS[S.tf], out = {};
  out.binance_spot = { deltas: S.K.map(c => 2 * c[6] - c[5]) };
  out.binance_fut = S.fut ? { deltas: alignMap(new Map(S.fut.map(c => [c[0], 2 * c[6] - c[5]])), times) } : { note: S.err.fut || '불러오는 중…' };
  for (const key of ['coinbase', 'okx']) {
    const hm = buildDeltas(key);
    if (!hm) { out[key] = { note: (D.cvd.find(x => x.key === key) || {}).error || '데이터 없음' }; continue; }
    if (tfMs > 4 * HOUR || tfMs < HOUR) { out[key] = { note: '1H · 4H 봉에서만 볼 수 있어요 (빌드 데이터 기준)' }; continue; }
    out[key] = { deltas: alignMap(tfMs === HOUR ? hm : aggregateHourly(hm, tfMs), times) };

  out.binance_oi = S.oi ? { values: alignMap(new Map(S.oi), times) } : { note: S.err.oi || '불러오는 중…' };
  out.cb_premium = S.cb ? { values: premiumPct(S.cb, new Map(S.K.map(c => [c[0], c[4]])), times) } : { note: S.err.cb || '불러오는 중…' };
  return out;
}

/* ---------- FVG list ---------- */

  if (!rows.length) return '<div class="none">아직 채워지지 않은 FVG가 없어요</div>';
  const line = ({ z, mid }) => {
    const col = z.kind === 'bull' ? T.bull : T.bear, pct = (mid / price - 1) * 100;
    return `<div class="fr" style="--c:${col}"><span class="tf">${z.tf}</span>` +
      `<span class="rg">${fmtP(z.lo)} – ${fmtP(z.hi)}<small>${z.kind === 'bull' ? '상승 갭 ▲ · 지지 후보' : '하락 갭 ▼ · 저항 후보'}</small></span>` +
      `<span class="ds">${sgn(pct, v => v.toFixed(1))}%</span></div>`;

  const i = rows.findIndex(r => r.mid < price), cut = i < 0 ? rows.length : i;

    if (!d || !anyVal(d) || tfMs > 4 * HOUR) continue;   // a 24h sum is only meaningful on <=4h bars
    const cut = Date.now() - 24 * HOUR; let s = 0;
    S.times.forEach((t, i) => { if (t >= cut && d[i] != null) s += d[i]; });
    rows.push(kpi(P[key].def.title.replace(' CVD', '') + ' 24h', sgn(s, x => fmtBig(x, 1)), `${arrow(s)} ${s >= 0 ? '순매수' : '순매도'}`, dir(s)));
  }
  const sig = rows.join('');
  if (sig !== kpiSig) { kpiSig = sig; $('kpis').innerHTML = sig; }
}
let kpiSig = '', fvgSig = '';
/** Claude's commentary from the last build (the page never calls an API itself, so no key is exposed here). */
const AI_JOBS = [['deep', '심층 리포트'], ['hourly', '시간별 코멘트']];
const aiModel = m => { const x = /(opus|sonnet|haiku|fable)-(\d+)(?:-(\d+))?/.exec(m || ''); return x ? x[1][0].toUpperCase() + x[1].slice(1) + ' ' + x[2] + (x[3] ? '.' + x[3] : '') : (m || ''); };
const aiAge = ms => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 2 ? '방금' : m < 90 ? `${m}분 전` : m < 2880 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`; };
function aiBlock(j, label, open) {
  const a = j && j.analysis; if (!a) return '';
  const li = x => `<li>${esc(x)}</li>`, cls = a.bias.includes('상승') ? 'up' : a.bias.includes('하락') ? 'down' : '';
  const tfs = ['15m', '1h', '4h', '1d'].filter(k => a.timeframes[k]).map(k => `<b>${k}</b><span>${esc(a.timeframes[k])}</span>`).join('');
  return `<details class="aib"${open ? ' open' : ''}><summary><span class="bias ${cls}">${esc(a.bias)}</span><span class="aih"><b>${label}</b> · ${esc(aiModel(j.model))}${j.generated_ms ? ' · ' + aiAge(j.generated_ms) : ''}</span></summary>` +
    `<h3>${esc(a.headline)}</h3><ul>${a.summary.map(li).join('')}</ul>` +
    (tfs ? `<h4>타임프레임별</h4><div class="tfa">${tfs}</div>` : '') +
    (a.flow ? `<h4>수급 종합</h4><p>${esc(a.flow)}</p>` : '') +
    (a.watch.length ? `<h4>지켜볼 가격대</h4>${a.watch.map(w => `<div class="wl"><b>${esc(w.level)}</b><span>${esc(w.why)}</span></div>`).join('')}` : '') +
    (a.caveats.length ? `<h4>참고</h4><ul>${a.caveats.map(li).join('')}</ul>` : '') + '</details>';
}
function paintAi() {
  const ai = D.ai; if (!ai) return;
  const blocks = AI_JOBS.map(([k, label], i) => aiBlock(ai[k], label, i === 0 || !(ai[AI_JOBS[0][0]] && ai[AI_JOBS[0][0]].analysis)));
  if (!blocks.some(Boolean)) return;
  $('aibody').innerHTML = blocks.join('') + '<div class="foot">Claude가 위 데이터 요약만 보고 쓴 해설이에요 · 투자 조언이 아니고 예측도 아니에요</div>';
  const newest = Math.max(...AI_JOBS.map(([k]) => (ai[k] && ai[k].generated_ms) || 0));
  $('aisub').textContent = newest ? `${aiAge(newest)} 갱신` : '';
  $('ai').hidden = false; $('aitab').hidden = false;
}
function paintFvg(T) { const h = fvgList(T); if (h !== fvgSig) { fvgSig = h; $('fvgmap').innerHTML = h; } }

/* ---------- render ---------- */
const wide = () => matchMedia('(min-width: 960px)').matches;
const shown = sec => wide() || document.body.dataset.tab === sec;
function setRange(count) {   // state only: the next full render applies it to the charts
  const n = S.K.length;
  state.i1 = n - 1; state.i0 = Math.max(0, n - Math.min(count, n));
}
function renderAll() {
  if (!S) return;
  const T = theme();
  for (const key in P) paintPanel(key, T);       // fills P[key].data first
  main.setOption(mainOption(T), true);
  paintFvg(T);
  paintHero(); paintKpis(); paintControls();
  $('theme').innerHTML = css('--mode') === 'dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>';
  document.querySelector('meta[name="theme-color"]').content = css('--bg');
}
function loadPanelData() { const d = buildPanelData(S); for (const key in P) P[key].data = d[key]; }

let viewTimer = 0;
function refreshView() {   // visible window changed: refit the price axis, FVG boxes and every panel (throttled)
  if (viewTimer) return;
  viewTimer = setTimeout(() => {
    viewTimer = 0;
    if (!S) return;
    const T = theme(), [ymin, ymax] = yRange();
    main.setOption({ yAxis: { min: ymin, max: ymax }, series: [{ id: 'k', markArea: { silent: true, data: zoneBoxes(T, ymin, ymax) } }] });
    if (shown('flow')) for (const key in P) paintPanel(key, T);
    paintKpis(); markCount();
  }, 90);
}
main.on('datazoom', () => {
  if (!S) return;
  const opt = main.getOption().dataZoom, dz = opt && opt[0], n = S.K.length;
  if (!dz || dz.start == null) return;
  const i0 = Math.max(0, Math.round(dz.start / 100 * (n - 1))), i1 = Math.min(n - 1, Math.round(dz.end / 100 * (n - 1)));
  if (i0 === state.i0 && i1 === state.i1) return;
  state.i0 = i0; state.i1 = i1; refreshView();
});

/* ---------- loading a timeframe ---------- */
function banner(msg) { const b = $('banner'); b.hidden = !msg; b.textContent = msg || ''; }
let reqId = 0, retryTf = null;
const periodsSince = d => Math.ceil((Date.now() - d.K[d.K.length - 1][0]) / TFS[d.tf]);
async function loadTF(tf, opts = {}) {
  const id = ++reqId;                                   // only the newest request may touch the screen
  state.tf = tf; lsSet('btc-tf', tf); paintControls();
  let d = opts.fresh ? null : store[tf];
  $('ld').hidden = !!d || !!S;
  if (!d) $('ld').hidden = false;
  try {
    if (!d) d = { tf, K: await spotK(tf, 1000), fut: null, oi: null, cb: null, err: {} };
    else {   // revisiting: top up everything since we last looked (a long absence needs more than 5 bars)
      d.recentN = Math.min(1000, Math.max(5, periodsSince(d) + 2));
      d.K = mergeRows(d.K, await spotK(tf, d.recentN));
    }
  } catch (e) {
    if (id !== reqId) return;
    const why = String(e.message || e);
    $('ld').hidden = true;
    if (S && !state.fallback) { state.tf = S.tf; paintControls(); retryTf = tf; banner(`${tf} 데이터를 불러오지 못했어요 (${why}). 눌러서 다시 시도`); return; }
    return useFallback(why, tf);
  }
  if (id !== reqId) return;
  store[tf] = d; retryTf = null;
  state.fallback = false; banner('');
  S = d; computeEma(S); computeLabels(S);
  setRange(state.count);
  loadPanelData(); renderAll(); $('ld').hidden = true;
  subscribe();
  loadAux(S);   // futures CVD, OI, premium arrive after the first paint
  loadHtf();
}
async function loadAux(d) {
  const tf = d.tf, n = d.recentN || 5; d.recentN = 0;
  const jobs = [
    ['fut', () => d.fut ? futK(tf, n).then(r => mergeRows(d.fut, r)) : futK(tf, 1000)],
    ['oi', () => d.oi ? oiHist(tf, Math.min(500, n)).then(r => mergeRows(d.oi, r)) : oiHist(tf, 500)],
    ['cb', () => d.cb ? cbCloses(tf, 1, n <= 5).then(m => new Map([...d.cb, ...m])) : cbCloses(tf, tf === '4h' ? 3 : 2)],
  ];
  await Promise.all(jobs.map(async ([k, fn]) => {
    try { d[k] = await fn(); delete d.err[k]; } catch (e) { if (!d[k]) d.err[k] = '불러오지 못했어요 (' + String(e.message || e).slice(0, 40) + ')'; }
  }));
  if (S !== d) return;   // timeframe changed while loading
  loadPanelData();
  const T = theme(); if (shown('flow')) for (const key in P) paintPanel(key, T, true);
  paintKpis();
}
async function loadHtf() {
  try {
    const first = !HTF['4h'].length;
    const [a, b] = await Promise.all([spotK('4h', first ? 500 : 6), spotK('1d', first ? 365 : 6)]);
    HTF['4h'] = first ? a : mergeRows(HTF['4h'], a);
    HTF['1d'] = HTF['1d'].length ? mergeRows(HTF['1d'], b) : b;
  } catch (e) { if (!HTF['4h'].length) return; }
  rebuildFvg();
  if (S) { const T = theme(); paintFvg(T); refreshView(); }
}
/** Live feed unreachable: show the last build (1H) so the page is never blank. */
function useFallback(why, wanted) {
  state.fallback = true; state.tf = '1h'; retryTf = wanted || '15m';
  const K = D.candles.map(c => [c[0], c[1], c[2], c[3], c[4], 0, 0]);
  S = { tf: '1h', K, fut: null, oi: null, cb: null, err: {} };
  computeLabels(S);
  S.ema = {}; for (const p of EMA_PERIODS) S.ema[p] = D.ema[p] || D.ema[String(p)];
  fvgZones = D.fvg;
  setRange(Math.min(state.count, K.length));
  loadPanelData();
  const sp = D.cvd.find(x => x.key === 'binance_spot'), ft = D.cvd.find(x => x.key === 'binance_fut');
  const dl = a => a.map((v, i) => v == null ? null : v - (i ? (a[i - 1] || 0) : 0));
  if (sp && sp.values) P.binance_spot.data = { deltas: dl(sp.values) };
  if (ft && ft.values) P.binance_fut.data = { deltas: dl(ft.values) };
  for (const e of D.extra || []) if (e.values) P[e.key].data = { values: e.values };
  banner(`실시간 연결에 실패해서 마지막 빌드(${D.generated} ${D.tz}) 1H 데이터를 보여줘요. 눌러서 다시 시도 (${why})`);
  $('ld').hidden = true; renderAll();
}

/* ---------- live feed: miniTicker (1s) + kline of the selected timeframe ---------- */
let ws = null, wsTries = 0, wsSubTf = null, wsReady = false, wsTimer = 0, lastMsg = 0, wasDown = false;
const HOSTS = ['wss://data-stream.binance.vision/stream', 'wss://stream.binance.com:9443/stream'];
function setLive(status) {
  const el = $('stamp'); el.classList.toggle('stale', status !== 'live');
  $('ago').textContent = status === 'live' ? 'LIVE · 1초 갱신' : status === 'connecting' ? '연결 중…' : '연결 끊김 · 재연결 중';
  el.title = D.generated ? `빌드 ${D.generated} ${D.tz} (OKX·Coinbase CVD 기준)` : '';
}
function connect() {
  clearTimeout(wsTimer);
  if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch (e) {} ws = null; }   // never keep two sockets
  let sock;
  try { sock = new WebSocket(HOSTS[wsTries % HOSTS.length]); } catch (e) { return retry(); }
  ws = sock; lastMsg = Date.now(); setLive('connecting');
  sock.onopen = () => {
    if (sock !== ws) return;
    wsTries = 0; wsSubTf = null; wsReady = false; setLive('live'); subscribe();
    if (wasDown) { wasDown = false; backfill(); }   // candles may have closed while we were away
  };
  sock.onmessage = e => {
    if (sock !== ws) return;
    lastMsg = Date.now();
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    const d = m.data; if (!d) return;
    if (d.e === '24hrMiniTicker') onTicker(d); else if (d.e === 'kline') onKline(d.k);
  };
  sock.onclose = () => { if (sock === ws) retry(); };
  sock.onerror = () => { try { sock.close(); } catch (e) {} };
}
function retry() { clearTimeout(wsTimer); wasDown = true; setLive('down'); wsTries++; wsTimer = setTimeout(connect, Math.min(15000, 1000 * 2 ** Math.min(wsTries, 4))); }
setInterval(() => { if (!document.hidden && ws && ws.readyState === 1 && Date.now() - lastMsg > 8000) { wasDown = true; connect(); } }, 2000);   // half-open socket: no message for 8 s
function subscribe() {
  if (!ws || ws.readyState !== 1) return;
  if (!wsReady) { ws.send(JSON.stringify({ method: 'SUBSCRIBE', params: ['btcusdt@miniTicker'], id: 1 })); wsReady = true; }   // the 1 s price needs no dataset
  const tf = S && !state.fallback ? S.tf : null;
  if (tf === wsSubTf) return;
  if (wsSubTf) ws.send(JSON.stringify({ method: 'UNSUBSCRIBE', params: ['btcusdt@kline_' + wsSubTf], id: 2 }));
  if (tf) ws.send(JSON.stringify({ method: 'SUBSCRIBE', params: ['btcusdt@kline_' + tf], id: 3 }));
  wsSubTf = tf;
}
/** Re-read recent spot candles (after a socket gap) and merge them in. */
async function backfill() {
  const d = S; if (!d || state.fallback) return;
  try {
    const rows = await spotK(d.tf, Math.min(1000, periodsSince(d) + 2));
    if (S !== d) return;
    const follow = state.i1 >= d.K.length - 1, before = d.K.length;
    d.K = mergeRows(d.K, rows); computeLabels(d);
    const added = d.K.length - before;
    if (added > 1) setRange(state.count);                 // candles were inserted: indices moved, show the latest window
    else if (follow) { state.i1 = d.K.length - 1; state.i0 += added; }
    syncZoom = true; loadPanelData(); loadAux(d); loadHtf(); scheduleLive();
  } catch (e) { /* the next kline push or 20 s refresh will try again */ }
}
let liveRaf = 0;
function scheduleLive() {   // rAF can be throttled (low-power mode, covered pane): a timer guarantees the update still runs
  if (liveRaf) return;
  liveRaf = 1;
  const run = () => { if (!liveRaf) return; liveRaf = 0; renderLive(); };
  requestAnimationFrame(run); setTimeout(run, 300);
}
function onTicker(d) {
  tick = { c: +d.c, o: +d.o, h: +d.h, l: +d.l };
  if (S && !state.fallback) {   // ticker price keeps the forming candle moving between kline pushes
    const c = S.K[S.K.length - 1];
    if (Date.now() < c[0] + TFS[S.tf]) { c[4] = tick.c; c[2] = Math.max(c[2], tick.c); c[3] = Math.min(c[3], tick.c); }   // closed candles are final
  }
  scheduleLive();
}
function onKline(k) {
  if (!S || state.fallback || k.i !== S.tf) return;
  const row = [k.t, +k.o, +k.h, +k.l, +k.c, +k.q, +k.Q], n = S.K.length, last = S.K[n - 1];
  if (k.t === last[0]) { S.K[n - 1] = row; panelDirty = true; }
  else if (k.t > last[0] + TFS[S.tf]) { backfill(); return; }   // missed at least one whole candle
  else if (k.t > last[0]) {   // the next candle opened
    const follow = state.i1 >= n - 1;
    S.K.push(row); computeLabels(S);
    if (follow) { state.i1 = S.K.length - 1; state.i0 += 1; }   // otherwise the indices already point at the same candles
    syncZoom = true; loadPanelData(); loadAux(S); loadHtf();
  } else return;
  scheduleLive();
}
let lastFull = 0, syncZoom = false, panelDirty = false;
function renderLive() {
  if (!S || document.hidden) return;
  const T = theme(), now = Date.now();
  computeEma(S);   // the forming candle moves every second, so the EMAs do too
  paintHero();
  const [ymin, ymax] = yRange();
  const upd = { yAxis: { min: ymin, max: ymax }, xAxis: { data: S.labels },
    series: [{ id: 'k', data: candleData(), markLine: priceLine(T) }, ...EMA_PERIODS.map(p => ({ id: 'e' + p, data: state.ema[p] ? S.ema[p] : [] }))] };
  if (syncZoom) {   // keep the main chart on the same candles after labels were extended (one entry per dataZoom component that exists)
    syncZoom = false;
    upd.dataZoom = main.getOption().dataZoom.map(() => ({ startValue: state.i0, endValue: state.i1 }));
    refreshView();
  }
  if (shown('chart')) main.setOption(upd);
  if (now - lastFull > 2000) {   // panels, KPIs and the FVG list change slowly: refresh every 2s
    lastFull = now;
    if (panelDirty) { panelDirty = false; loadPanelData(); }
    if (shown('flow')) for (const key in P) paintPanel(key, T, true);
    if (shown('fvg')) paintFvg(T);
    paintKpis();
  }
}

/* ---------- controls ---------- */
$('banner').addEventListener('click', () => { banner(''); loadTF(retryTf || '15m', { fresh: true }); if (!ws || ws.readyState > 1) connect(); });
$('tfs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled || b.dataset.tf === state.tf) return; loadTF(b.dataset.tf); });
$('counts').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.count = +b.dataset.r; lsSet('btc-count', state.count); setRange(state.count);
  main.dispatchAction({ type: 'dataZoom', startValue: state.i0, endValue: state.i1 }); refreshView(); });
$('emarow').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !S) return;
  if (b.id === 'emaall') { const on = !EMA_PERIODS.some(k => state.ema[k]); for (const k of EMA_PERIODS) state.ema[k] = on ? 1 : 0; }
  else state.ema[b.dataset.ema] ^= 1;
  lsSet('btc-ema', JSON.stringify(state.ema)); paintControls();
  main.setOption({ series: EMA_PERIODS.map(p => ({ id: 'e' + p, data: state.ema[p] ? S.ema[p] : [] })) });
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });
function setTab(t) {
  document.body.dataset.tab = t;
  for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.tab === t);
  lsSet('btc-tab', t);
  requestAnimationFrame(() => { resizeAll(); if (S) renderAll(); scrollTo({ top: Math.min(scrollY, $('tabs').offsetTop), behavior: 'instant' }); });
}
function resizeAll() { main.resize(); for (const k in P) P[k].chart.resize(); }
let rsT = 0, lastW = innerWidth;
window.addEventListener('resize', () => {   // mobile URL-bar show/hide fires resize constantly: only react to width changes
  clearTimeout(rsT);
  rsT = setTimeout(() => { if (innerWidth === lastW) { resizeAll(); return; } lastW = innerWidth; resizeAll(); if (S) renderAll(); }, 150);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S && renderAll());
$('theme').addEventListener('click', () => {
  const root = document.documentElement, dark = css('--mode') === 'dark';
  root.dataset.theme = dark ? 'light' : 'dark'; lsSet('btc-theme', root.dataset.theme);
  if (S) renderAll();
});
let hiddenAt = document.hidden ? Date.now() : 0;   // 0 = we have not seen the page hidden yet (never treat that as a long absence)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  const away = hiddenAt ? Date.now() - hiddenAt : 0;
  if (away > 30 * 60e3) return location.reload();          // pick up a newer build (OKX / Coinbase CVD, new code)
  if (away > 20e3) loadTF(state.fallback ? (retryTf || '15m') : state.tf, { fresh: state.fallback });   // the socket may have slept: top up the gap (full reload only from the fallback)
  if (!ws || ws.readyState > 1) connect();
});

/* ---------- boot ---------- */
const t0 = lsGet('btc-theme', ''); if (t0) document.documentElement.dataset.theme = t0;
paintAi();
const tab0 = lsGet('btc-tab', 'chart'); if (['chart', 'flow', 'fvg', ...($('aitab').hidden ? [] : ['ai'])].includes(tab0)) setTab(tab0);
paintControls();
getJSON(`${BN}/api/v3/ticker/24hr?symbol=BTCUSDT`).then(t => { if (!tick) { tick = { c: +t.lastPrice, o: +t.openPrice, h: +t.highPrice, l: +t.lowPrice }; paintHero(); paintKpis(); } }).catch(() => {});
connect();
loadTF(state.tf);
setInterval(() => { if (!document.hidden && S && !state.fallback) loadAux(S); }, 20000);    // futures CVD / OI / premium for the forming bar
setInterval(() => { if (!document.hidden && S && !state.fallback) loadHtf(); }, 60000);     // 4H / 1D candles -> FVG fills
</script>
