<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Chart</title>
<style>
  :root {
    --bg: #f3f1ec; --card: #fcfbf9; --fg: #2b2b2e; --mute: #8a8a90; --grid: #ebe8e2; --rule: #dedbd5;
    --up: #5aa68c; --down: #c0587a;
    --e20: #2c7a8c; --e50: #8e5ba8; --e100: #b9812f; --e200: #4a5fb5;
    --bull: #4d9d86; --bear: #c0587a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101114; --card: #17181c; --fg: #e6e4df; --mute: #8f9096; --grid: #26272c; --rule: #2f3137;
      --up: #5fbf9f; --down: #d4688a;
      --e20: #4fb0c4; --e50: #b284cc; --e100: #d9a14d; --e200: #7b8fe0;
      --bull: #5fbf9f; --bear: #d4688a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101114; --card: #17181c; --fg: #e6e4df; --mute: #8f9096; --grid: #26272c; --rule: #2f3137;
    --up: #5fbf9f; --down: #d4688a;
    --e20: #4fb0c4; --e50: #b284cc; --e100: #d9a14d; --e200: #7b8fe0;
    --bull: #5fbf9f; --bear: #d4688a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .page { max-width: 1560px; margin: 0 auto; padding: 20px 16px 32px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 28px; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 26px; font-weight: 500; letter-spacing: .01em; }
  .price { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .chg { font-size: 14px; font-variant-numeric: tabular-nums; margin-left: 8px; }
  .stamp { color: var(--mute); font-size: 12px; }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--mute); background: var(--card); border: 1px solid var(--rule);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { color: var(--fg); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
  .col { display: grid; gap: 16px; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .card h2 { margin: 0 0 2px; font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
  .card h2 small { color: var(--mute); font-weight: 400; font-size: 12px; }
  #main { height: 620px; }
  .cvd { height: 150px; }
  .none { height: 150px; display: flex; align-items: center; color: var(--mute); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 5px 4px; border-top: 1px solid var(--grid); }
  td.r { text-align: right; }
  tr.now td { color: var(--fg); font-weight: 600; background: color-mix(in srgb, var(--mute) 10%, transparent); }
  .tag { display: inline-block; min-width: 26px; text-align: center; font-size: 11px; padding: 0 5px;
    border-radius: 4px; border: 1px solid currentColor; margin-right: 6px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>BTC · 1H</h1>
    <div><span class="price" id="px"></span><span class="chg" id="chg"></span></div>
    <div class="stamp" id="stamp"></div>
    <div class="spacer"></div>
    <button id="theme" title="라이트/다크 전환">테마</button>
  </header>
  <div class="layout">
    <div class="col">
      <div class="card"><h2>가격 · EMA · FVG <small>휠: 확대/축소 · 드래그: 이동</small></h2><div id="main"></div></div>
      <div class="card"><h2>FVG 맵 <small>4H · 1D, 미채움 구간</small></h2><div id="fvgmap"></div></div>
    </div>
    <div class="col" id="panels"></div>
  </div>
</div>
<script>/*__ECHARTS__*/</script>
<script>
const D = /*__DATA__*/null;
const HOUR = 3600e3, n = D.candles.length, t0 = D.candles[0][0];
const FONT = '-apple-system, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif';
const EMA_VARS = { 20: '--e20', 50: '--e50', 100: '--e100', 200: '--e200' };
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const pad2 = v => String(v).padStart(2, '0');
function fmtT(ms) {
  const d = new Date(ms + D.utc_offset * HOUR);
  return `${pad2(d.getUTCDate())}/${pad2(d.getUTCMonth() + 1)}, ${pad2(d.getUTCHours())}:00`;
}
function fmtBig(v, dec = 2) {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e9) return s + (a / 1e9).toFixed(dec) + 'B';
  if (a >= 1e6) return s + (a / 1e6).toFixed(dec) + 'M';
  if (a >= 1e3) return s + (a / 1e3).toFixed(dec) + 'K';
  return s + a.toFixed(dec);
}
const fmtP = v => v.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtP0 = v => v.toLocaleString('en-US', { maximumFractionDigits: 0 });
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const labels = D.candles.map(c => fmtT(c[0]));
const last = D.candles[n - 1][4], lastUp = last >= D.candles[n - 1][1];

/* header */
const ref = D.candles[Math.max(0, n - 25)][4], chg = (last / ref - 1) * 100;
document.getElementById('px').textContent = fmtP(last);
const chgEl = document.getElementById('chg');
chgEl.textContent = `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}% (24h)`;
chgEl.style.color = `var(${chg >= 0 ? '--up' : '--down'})`;
document.getElementById('stamp').textContent = `${D.generated} ${D.tz}`;

/* layout: main chart + one card per CVD source, then the extra (OI, premium) panels */
const GROUP = 'btc';
const PANELS = D.cvd.concat(D.extra || []);
const fmtPanel = (p, v, dec) => p.fmt === 'pct' ? (v > 0 ? '+' : '') + v.toFixed(3) + '%' : fmtBig(v, dec);
document.getElementById('panels').innerHTML = PANELS.map(p =>
  `<div class="card"><h2><span style="color:${p.color}">${esc(p.title)}</span><small>${p.values ? (p.sub || '누적 · 창 시작=0') : ''}</small></h2>` +
  (p.values ? `<div class="cvd" id="c-${p.key}"></div>` : `<div class="none">데이터 없음 — ${esc((p.error || '').slice(0, 120))}</div>`) + '</div>').join('');

const main = echarts.init(document.getElementById('main'));
main.group = GROUP;
const cvdCharts = {};
for (const p of PANELS) if (p.values) { const c = echarts.init(document.getElementById('c-' + p.key)); c.group = GROUP; cvdCharts[p.key] = c; }
echarts.connect(GROUP);

function theme() {
  return { fg: css('--fg'), mute: css('--mute'), grid: css('--grid'), rule: css('--rule'), card: css('--card'),
    up: css('--up'), down: css('--down'), bull: css('--bull'), bear: css('--bear') };
}

function tipRow(k, v, col) {
  return `<div style="display:flex;justify-content:space-between;gap:16px"><span style="color:${col || 'inherit'};opacity:${col ? 1 : .65}">${k}</span><b style="font-weight:500">${v}</b></div>`;
}
function mainTip(i) {
  const c = D.candles[i];
  let h = `<div style="margin-bottom:3px"><b>${labels[i]}</b></div>` +
    tipRow('O', fmtP(c[1])) + tipRow('H', fmtP(c[2])) + tipRow('L', fmtP(c[3])) + tipRow('C', fmtP(c[4]));
  for (const [per, a] of Object.entries(D.ema)) if (a[i] != null) h += tipRow('EMA ' + per, fmtP(a[i]), css(EMA_VARS[per]));
  for (const p of D.cvd) if (p.values && p.values[i] != null) h += tipRow(p.title.replace(' CVD', ''), fmtBig(p.values[i]), p.color);
  return h;
}

function mainOption(T) {
  const lo = Math.min(...D.candles.map(c => c[3])), hi = Math.max(...D.candles.map(c => c[2]));
  const pad = (hi - lo) * 0.06, ymin = lo - pad, ymax = hi + pad;
  const zones = D.fvg.filter(z => z.hi > ymin && z.lo < ymax).map(z => {
    const col = z.kind === 'bull' ? T.bull : T.bear, i0 = Math.max(0, Math.round((z.t - t0) / HOUR));
    return [
      { xAxis: labels[i0], yAxis: Math.max(z.lo, ymin),
        itemStyle: { color: col, opacity: 0.16, borderColor: col, borderType: 'dashed', borderWidth: 1 },
        label: { show: true, position: 'insideTopRight', color: col, fontSize: 11, formatter: `FVG ${z.tf} ${z.kind === 'bull' ? '▲' : '▼'}` } },
      { xAxis: labels[n - 1], yAxis: Math.min(z.hi, ymax) },
    ];
  });
  const lc = lastUp ? T.up : T.down;
  const emaSeries = Object.entries(D.ema).map(([per, arr]) => ({
    name: 'EMA ' + per, type: 'line', data: arr, showSymbol: false, silent: true, z: 3,
    lineStyle: { width: 1.6, color: css(EMA_VARS[per]) }, itemStyle: { color: css(EMA_VARS[per]) },
  }));
  return {
    animation: false, textStyle: { fontFamily: FONT },
    legend: { top: 0, left: 0, icon: 'roundRect', itemWidth: 16, itemHeight: 3, itemGap: 16, textStyle: { color: T.mute, fontSize: 12 },
      data: emaSeries.map(s => s.name) },
    grid: { left: 62, right: 14, top: main.getWidth() < 460 ? 58 : 34, bottom: 62 },  // legend wraps to 2 lines on phones
    xAxis: { type: 'category', data: labels, boundaryGap: true, axisLine: { lineStyle: { color: T.rule } },
      axisTick: { show: false }, axisLabel: { color: T.mute, hideOverlap: true }, axisPointer: { label: { show: true } } },
    yAxis: { scale: true, min: ymin, max: ymax, splitLine: { lineStyle: { color: T.grid } },
      axisLabel: { color: T.mute, formatter: fmtP0 }, axisPointer: { label: { formatter: p => fmtP(p.value) } } },
    dataZoom: [
      { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
      { type: 'slider', xAxisIndex: 0, height: 20, bottom: 12, filterMode: 'none', borderColor: T.rule,
        fillerColor: 'rgba(120,120,130,.15)', textStyle: { color: T.mute }, dataBackground: { lineStyle: { color: T.rule }, areaStyle: { color: T.grid } } },
    ],
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross', lineStyle: { type: 'dashed', color: T.mute }, crossStyle: { color: T.mute },
        label: { backgroundColor: T.mute } },
      backgroundColor: T.card, borderColor: T.rule, textStyle: { color: T.fg, fontSize: 12 },
      formatter: ps => mainTip(ps[0].dataIndex) },
    series: [
      { name: 'BTC', type: 'candlestick', data: D.candles.map(c => [c[1], c[4], c[3], c[2]]),
        itemStyle: { color: T.up, color0: T.down, borderColor: T.up, borderColor0: T.down },
        markArea: { silent: true, data: zones },
        markLine: { silent: true, symbol: 'none', lineStyle: { color: lc, type: 'dotted' },
          label: { position: 'insideEndTop', formatter: fmtP(last), color: '#fff', backgroundColor: lc, padding: [3, 6], borderRadius: 3 },
          data: [{ yAxis: last }] } },
      ...emaSeries,
    ],
  };
}

function cvdOption(p, T) {
  const vs = p.values.filter(v => v != null), lo = Math.min(...vs), hi = Math.max(...vs);
  return {
    animation: false, textStyle: { fontFamily: FONT },
    grid: { left: 62, right: 12, top: 10, bottom: 22 },
    xAxis: { type: 'category', data: labels, boundaryGap: false, axisLine: { lineStyle: { color: T.rule } }, axisTick: { show: false },
      axisLabel: { color: T.mute, hideOverlap: true, fontSize: 11 }, axisPointer: { label: { show: false } } },
    yAxis: { scale: true, splitNumber: 2, splitLine: { lineStyle: { color: T.grid } },
      axisLabel: { color: T.mute, fontSize: 11, formatter: v => fmtPanel(p, v, p.fmt === 'pct' ? 2 : 1) }, axisPointer: { label: { show: false } } },
    dataZoom: [{ type: 'inside', xAxisIndex: 0, filterMode: 'none' }],
    tooltip: { trigger: 'axis', axisPointer: { type: 'line', lineStyle: { type: 'dashed', color: T.mute } },
      backgroundColor: T.card, borderColor: T.rule, textStyle: { color: T.fg, fontSize: 12 },
      formatter: ps => `<b>${labels[ps[0].dataIndex]}</b><br><span style="color:${p.color}">●</span> ${ps[0].value == null ? '–' : fmtPanel(p, ps[0].value)}` },
    series: [{ type: 'line', data: p.values, showSymbol: false, smooth: false, lineStyle: { width: 1.8, color: p.color }, itemStyle: { color: p.color },
      areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: p.color + '33' }, { offset: 1, color: p.color + '00' }] } },
      markLine: lo < 0 && hi > 0 ? { silent: true, symbol: 'none', label: { show: false }, lineStyle: { color: T.mute, type: 'dashed', opacity: .5 }, data: [{ yAxis: 0 }] } : undefined }],
  };
}

function fvgTable(T) {
  const rows = D.fvg.map(z => ({ z, mid: (z.lo + z.hi) / 2 })).sort((a, b) => b.mid - a.mid);
  const line = ({ z, mid }) => {
    const col = z.kind === 'bull' ? T.bull : T.bear, pct = (mid / last - 1) * 100;
    return `<tr><td style="color:${col}"><span class="tag">${z.tf}</span>${z.kind === 'bull' ? '상승 ▲' : '하락 ▼'}</td>` +
      `<td class="r">${fmtP(z.lo)} – ${fmtP(z.hi)}</td><td class="r" style="color:${col}">${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</td></tr>`;
  };
  const i = rows.findIndex(r => r.mid < last), cut = i < 0 ? rows.length : i;
  const now = `<tr class="now"><td colspan="2">현재가</td><td class="r">${fmtP(last)}</td></tr>`;
  return '<table>' + rows.slice(0, cut).map(line).join('') + now + rows.slice(cut).map(line).join('') + '</table>';
}

function render() {
  const T = theme();
  main.setOption(mainOption(T), true);
  for (const p of PANELS) if (cvdCharts[p.key]) cvdCharts[p.key].setOption(cvdOption(p, T), true);
  document.getElementById('fvgmap').innerHTML = fvgTable(T);
}
render();

window.addEventListener('resize', () => { main.resize(); Object.values(cvdCharts).forEach(c => c.resize()); render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement, dark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#101114';
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('btc-theme', root.dataset.theme); } catch (e) {}
  render();
});
try { const t = localStorage.getItem('btc-theme'); if (t) { document.documentElement.dataset.theme = t; render(); } } catch (e) {}
</script>
</body>
</html>
