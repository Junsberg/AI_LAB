name: collect

on:
  schedule:
    - cron: "*/30 * * * *"   # 48 runs/day × ~1 min ≈ 1,440 min/month, inside the 2,000-min free cap for private repos
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e .
      - run: python -m memebot.collectors.poll
