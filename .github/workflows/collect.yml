name: collect

on:
  schedule:
    - cron: "*/10 * * * *"   # public repo: Actions minutes are unlimited
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "memebot/**"
      - "pyproject.toml"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e .
      - run: python -m memebot.collectors.poll
      - name: rugcheck risk snapshot
        if: always()
        run: python -m memebot.collectors.rugcheck
