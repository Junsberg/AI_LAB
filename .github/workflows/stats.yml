name: stats

on:
  schedule:
    - cron: "37 * * * *"   # hourly, after enrich
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"
      - "memebot/review/stats.py"

concurrency:
  group: stats
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e .
      - run: python -m memebot.review.stats
      - name: health check
        id: health
        continue-on-error: true
        run: python -m memebot.review.health
      - name: open issue on critical health
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(python -c "import json;d=json.load(open('docs/stats/health.json'));print('\n'.join(f\"- **{c['name']}** ({c['level']}): {c['detail']}\" for c in d['checks'] if not c['ok']))")"
          existing=$(gh issue list --label health --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still critical at $(date -u +%FT%TZ):"$'\n'"$body"
          else
            gh label create health --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "memebot health: CRITICAL" --label health --body "$body"
          fi
      - name: actions summary (last 24h, so reviews need no API access)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '24 hours ago' +%FT%TZ)
          gh run list --limit 400 --created ">=$since" \
            --json name,event,conclusion,status,createdAt,url,headBranch \
            | python -c "
          import json,sys,collections
          runs=json.load(sys.stdin)
          by=collections.defaultdict(lambda: collections.Counter())
          fails=[]
          for r in runs:
              c=r['conclusion'] or r['status']
              by[r['name']][f\"{r['event']}:{c}\"]+=1
              if c not in ('success','in_progress','queued','pending','skipped'):
                  fails.append({k:r[k] for k in ('name','event','conclusion','createdAt','url','headBranch')})
          out={'generated_at':'$(date -u +%FT%TZ)','window_h':24,'runs':len(runs),
               'by_workflow':{k:dict(v) for k,v in by.items()},'failures':fails}
          json.dump(out,open('docs/stats/actions.json','w'),indent=1)
          print(json.dumps({k:sum(v.values()) for k,v in by.items()}), 'failures', len(fails))
          "
      - name: commit stats
        run: |
          git config user.name "memebot-stats"
          git config user.email "stats@users.noreply.github.com"
          git add docs/stats
          git diff --cached --quiet || git commit -m "stats: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash origin main
          git push
