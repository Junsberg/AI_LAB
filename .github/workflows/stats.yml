name: stats

on:
  schedule:
    - cron: "37 * * * *"   # hourly, after enrich
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"
      - "memebot/review/stats.py"

concurrency:
  group: stats
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e .
      - run: python -m memebot.review.stats
      - name: health check
        id: health
        continue-on-error: true
        run: python -m memebot.review.health
      - name: open issue on critical health
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(python -c "import json;d=json.load(open('docs/stats/health.json'));print('\n'.join(f\"- **{c['name']}** ({c['level']}): {c['detail']}\" for c in d['checks'] if not c['ok']))")"
          existing=$(gh issue list --label health --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still critical at $(date -u +%FT%TZ):"$'\n'"$body"
          else
            gh label create health --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "memebot health: CRITICAL" --label health --body "$body"
          fi
      - name: commit stats
        run: |
          git config user.name "memebot-stats"
          git config user.email "stats@users.noreply.github.com"
          git add docs/stats
          git diff --cached --quiet || git commit -m "stats: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash origin main
          git push
