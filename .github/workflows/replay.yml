name: replay

# lineage_v0 replay report (docs/stats/replay_lineage_v0.json). On demand, and once
# when the replay or simulator code changes on main. Shares GeckoTerminal's rate limit
# with outcomes, so it is never scheduled.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/replay.yml"
      - "memebot/review/paper_replay.py"
      - "memebot/execution/sim.py"

concurrency:
  group: replay
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e .
      - run: python -m memebot.review.paper_replay
      - name: commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats/replay_lineage_v0.json
          git diff --cached --quiet || git commit -m "replay: lineage_v0 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash origin main
          git push
