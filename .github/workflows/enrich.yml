name: enrich

on:
  schedule:
    - cron: "17 * * * *"   # hourly, offset from collect
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enrich.yml"
      - "memebot/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e .
        id: setup
      - name: backfill deployer verification (pre-fix tokens)
        continue-on-error: true
        run: python -m memebot.lineage.backfill
      - name: lineage (trace → cluster → score)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python -m memebot.lineage.job
