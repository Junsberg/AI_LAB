name: enrich

on:
  schedule:
    - cron: "17 * * * *"   # hourly, offset from collect
  workflow_dispatch:

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e .
      - name: outcomes (24h/72h evaluation)
        run: python -m memebot.outcomes.evaluate
      - name: lineage (trace → cluster → score)
        run: python -m memebot.lineage.job
